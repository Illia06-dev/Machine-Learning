experiment: lab06
run_name: adam_plateau
seed: 42
device: auto
data:
  name: fashionmnist
  root: ../data
  batch_size: 128
  num_workers: 2
  pin_memory: true
  subset: null
model:
  name: Lab3CNN
  in_channels: 1
  num_classes: 10
  dropout: 0.3
train:
  epochs: 10
  optimizer: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: plateau
  step_size: 3
  gamma: 0.1
  plateau_patience: 1
  accum_steps: 1
  stop_after_epoch: null
checkpoint:
  dir: results/checkpoints
  resume: null
mlflow:
  tracking_uri: sqlite:///mlflow.db
